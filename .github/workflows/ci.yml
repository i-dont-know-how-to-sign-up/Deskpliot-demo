name: deskpilot-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-regression:
    # 固定系统镜像，避免 ubuntu-latest 迁移导致 Qt 系统运行库漂移。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ALLOW_LOCAL_FALLBACK: "true"
      MEMORY_VECTOR_PROVIDER: sqlite
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux Qt runtime libraries
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          if python -c "import ctypes.util, sys; sys.exit(0 if ctypes.util.find_library('EGL') else 1)"; then
            echo 'libEGL.so.1 is already available; skipping apt.'
            exit 0
          fi
          sudo timeout 180s apt-get \
            -o Acquire::ForceIPv4=true \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 180s apt-get \
            -o DPkg::Lock::Timeout=60 \
            --no-install-recommends -y install libegl1
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify headless Qt runtime
        run: python -c "from PySide6.QtCore import QObject; from PySide6.QtGui import QGuiApplication; from PySide6.QtQml import QQmlApplicationEngine; print('PySide6 headless imports succeeded')"
      - name: Compile sources
        run: python -m compileall -q deskpilot tests eval
      - name: Run offline regression tests
        run: python -m pytest tests -q
      - name: Validate portable evaluation dataset
        run: python -c "from eval.run_eval import load_cases, DATASET; rows=load_cases(DATASET); assert len(rows)==160; assert len(rows)==len({r['id'] for r in rows}); print(f'validated {len(rows)} cases')"
      - name: Run deterministic offline evaluation smoke suite
        run: >-
          python -m eval.run_eval --mode offline
          --case-id rag_001
          --case-id route_002
          --case-id safe_001
          --case-id recovery_001
          --case-id reg_debug3_005
          --case-id reg_p1_negative_001
          --output /tmp/deskpilot-eval.jsonl
          --report /tmp/deskpilot-eval.md
