name: deskpilot-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLOW_LOCAL_FALLBACK: "true"
      MEMORY_VECTOR_PROVIDER: sqlite
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip PySide6 pypdf PyMuPDF
      - name: Compile sources
        run: python -m compileall -q deskpilot tests eval
      - name: Run offline test scripts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do
            echo "RUN ${test_file}"
            python "${test_file}"
          done
      - name: Validate portable evaluation dataset
        run: python -c "from eval.run_eval import load_cases, DATASET; rows=load_cases(DATASET); assert len(rows)==len({r['id'] for r in rows}); print(f'validated {len(rows)} cases')"
      - name: Run offline evaluation
        run: python -m eval.run_eval --count 152 --mode offline --output /tmp/deskpilot-eval.jsonl --report /tmp/deskpilot-eval.md
